kind = "mobile"
previewPath = "/"
title = "Book Tracker"
version = "1.0.0"
id = "artifacts/booktracker"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25581

[services.development]
run = "pnpm --filter @workspace/booktracker run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/booktracker", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/booktracker", "run", "serve" ]

[services.env]
PORT = "25581"
BASE_PATH = "/"
